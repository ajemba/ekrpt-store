<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Nav Diagnostic</title>
<link rel="stylesheet" href="css/style.css"/>
<link rel="stylesheet" href="css/theme-spectre-dark.css"/>
<style>
  #diag{position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#000;color:#0f0;
        font:13px/1.5 monospace;padding:14px;border-top:2px solid #0f0;max-height:55vh;overflow:auto}
  #diag b{color:#fd0}
  #diag .bad{color:#f55}
  #diag .ok{color:#5f5}
  body{padding-bottom:60vh}
  .spacer{height:1400px;background:linear-gradient(#111,#222);
          display:flex;align-items:center;justify-content:center;color:#666;font:14px monospace}
</style>
</head>
<body>
<div id="nav-mount"></div>
<div class="spacer">scroll content (so we can see if drawer floats over it)</div>
<div id="diag">running…</div>

<script src="js/main.js?v=diag"></script>
<script>
function log(){
  var m=document.getElementById('mobile-nav');
  var h=document.querySelector('.nav-hamburger');
  var nav=document.querySelector('.nav');
  var out=[];
  function line(label,val,good){
    out.push('<b>'+label+':</b> <span class="'+(good===true?'ok':good===false?'bad':'')+'">'+val+'</span>');
  }
  line('viewport width', window.innerWidth+'px');
  line('drawer element exists', m?'YES':'NO', !!m);
  if(m){
    var cs=getComputedStyle(m);
    line('drawer has .open class', m.classList.contains('open'), m.classList.contains('open'));
    line('drawer computed display', cs.display, cs.display!=='none');
    line('drawer position', cs.position);
    line('drawer top', cs.top);
    line('drawer z-index', cs.zIndex);
    line('drawer visibility', cs.visibility);
    line('drawer opacity', cs.opacity);
    line('drawer height', cs.height);
    line('drawer width', cs.width);
    line('drawer bg', cs.backgroundColor);
    line('drawer child links', m.children.length, m.children.length>0);
    line('drawer transform', cs.transform);
  }
  line('hamburger exists', h?'YES':'NO', !!h);
  if(h){ line('hamburger display', getComputedStyle(h).display); }
  if(nav){
    var ncs=getComputedStyle(nav);
    line('nav height', ncs.height);
    line('nav position', ncs.position);
    line('nav transform', ncs.transform);
    line('nav filter', ncs.filter);
    line('nav backdrop-filter', ncs.backdropFilter||ncs.webkitBackdropFilter);
  }
  line('toggleMobileNav defined', typeof toggleMobileNav, typeof toggleMobileNav==='function');
  document.getElementById('diag').innerHTML =
    '<div style="color:#fd0;margin-bottom:8px">TAP THE HAMBURGER, THEN TAP THIS BOX TO RE-READ</div>'+out.join('<br>');
}
document.addEventListener('DOMContentLoaded', function(){ setTimeout(log, 400); });
document.getElementById('diag').addEventListener('click', log);
</script>
</body>
</html>
